# Hugo site configuration — nster (sample site, multi-page)
# NOTE: this site contains PLACEHOLDER SAMPLE CONTENT only.
# Theme: blowfish v3.9.0 (git submodule at exact tag). Requires Hugo extended;
# the CI workflow pins 0.167.0 — see docs/adr/002-hugo-version-pin.md.

baseURL = 'https://sternnick.github.io/nster/'
title = 'Jane Sample — Sample Site'
theme = 'blowfish'
defaultContentLanguage = 'en'
enableRobotsTXT = true
summaryLength = 0

# Version note (corrected 2026-10-19): 0.167.0 is simply the pin this site builds
# green with. Blowfish v3.9.0 declares NO Hugo version constraint — theme.toml has
# no [hugoVersion] block and config/_default/module.toml is an empty blob — so the
# claim this file used to make, that the theme caps Hugo at 0.167.0, was wrong.
# Hugo 0.168.0 is untested with Blowfish here, not known-bad. See docs/adr/002.

[pagination]
  pagerSize = 100

[sitemap]
  # sitemap file is generated but the site is noindexed during the sample phase
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[params]
  colorScheme = 'blowfish'
  defaultAppearance = 'light'
  autoSwitchAppearance = true
  enableSearch = true

  # sample phase: keep the placeholder site out of search engines
  robots = 'noindex, nofollow'

  [params.homepage]
    layout = 'page'
    showRecent = false

  # CV download link lives in content/_index.md; the PDF is generated by CI
  # and published at /nster/cv.pdf (Pages artifact, never committed to git).

[languages.en.params.author]
  name = 'Jane Sample'
  headline = 'Sample Site — placeholder content only'

[menu]
  [[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menu.main]]
    name = 'CV'
    pageRef = '/cv/'
    weight = 20
  [[menu.main]]
    name = 'Projects'
    pageRef = '/projects/'
    weight = 30
  [[menu.main]]
    name = 'Notes'
    pageRef = '/notes/'
    weight = 40
  [[menu.main]]
    name = 'About'
    pageRef = '/about/'
    weight = 50

[outputs]
  # search index for the Fuse.js modal (search.js fetches <baseURL>/index.json)
  home = ['html', 'rss', 'json']

[markup]
  [markup.refLinks]
    # broken internal (relref) links fail the build instead of shipping 404s
    errorLevel = 'ERROR'
